<svg xmlns="http://www.w3.org/2000/svg" width="210mm" height="297mm" viewBox="0 0 210 297"><title>Sheetmint 100 mm scale check</title><g fill="#111" stroke="#111" stroke-width="0.2"><path d="M 10 30 H 110"/><path d="M 10 27 V 33"/><path d="M 20 27 V 33"/><path d="M 30 27 V 33"/><path d="M 40 27 V 33"/><path d="M 50 27 V 33"/><path d="M 60 27 V 33"/><path d="M 70 27 V 33"/><path d="M 80 27 V 33"/><path d="M 90 27 V 33"/><path d="M 100 27 V 33"/><path d="M 110 27 V 33"/></g><g font-family="Arial, sans-serif" font-size="4"><text x="10" y="20">100 mm scale check</text><text x="10" y="43">Print at actual size; measure between the end ticks.</text><text x="10" y="51">This checks scale, not label alignment or printer feed.</text></g></svg>